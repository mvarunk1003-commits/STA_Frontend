<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memos - OrgManager</title>
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SSTPA Portal">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .memos-timeline {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .memo-card {
      border-left: 4px solid var(--primary-color);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-placeholder" class="sidebar glass-panel"></div>
    
    <main class="main-content">
      <header id="header-placeholder" class="main-header"></header>

      <section style="display:flex; justify-content:space-between; align-items:center;" class="fade-in">
        <h2 style="font-size: 22px; font-weight:700;">Notice Board Memos</h2>
        <button class="btn btn-primary" onclick="openMemoModal()">+ Broadcast Memo</button>
      </section>

      <!-- Memos timeline list -->
      <section id="memo-list" class="memos-timeline fade-in">
        <div style="text-align:center; padding: 40px 0; color:var(--text-secondary);" class="glass-panel">
          Loading notices timeline...
        </div>
      </section>
    </main>
  </div>

  <!-- Broadcast Memo Modal -->
  <div id="broadcast-memo-modal" class="modal-overlay">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <h2 style="font-weight: 700; font-size:20px;">Broadcast Memo Notice</h2>
        <button onclick="closeModal('broadcast-memo-modal')" style="background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer;">&times;</button>
      </div>
      <form onsubmit="handleFormSubmit(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="memo-title">Memo Subject</label>
            <input type="text" id="memo-title" class="form-input" placeholder="e.g., Annual General Meeting Agenda" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="memo-content">Memo Body Text</label>
            <textarea id="memo-content" class="form-textarea" rows="6" placeholder="Write full details..." required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="memo-file">Attachment File (Optional)</label>
            <input type="file" id="memo-file" class="form-input" onchange="uploadMemoFile(event)">
            <input type="hidden" id="memo-file-url">
            <span id="upload-status" style="font-size:12px; color:var(--text-muted); display:block; margin-top:4px;"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('broadcast-memo-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish Memo</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadMemos);

    async function loadMemos() {
      try {
        const list = await apiFetch('/reports/memos-list');
        const container = document.getElementById('memo-list');

        if (!list || list.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding: 40px; color:var(--text-secondary);" class="glass-panel">
              <p style="font-size:16px; font-weight:500;">No memos published.</p>
              <p style="font-size:13px; margin-top:5px;">Memos, directives, and circular announcements will appear here.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = list.map(item => {
          const dateStr = new Date(item.created_at).toLocaleDateString(undefined, {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            year: 'numeric'
          });
          const fileAttachment = item.file_url 
            ? `<div style="margin-top:15px;"><a href="${window.location.origin}${item.file_url}" target="_blank" class="btn btn-secondary" style="font-size:12px; padding:6px 12px;">📂 View Attachment</a></div>`
            : '';

          return `
            <div class="glass-panel glass-card memo-card fade-in">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <h3 style="font-size: 20px; font-weight:700; margin-bottom:4px;">${item.title}</h3>
                  <span style="font-size:12px; color:var(--text-muted);">${dateStr}</span>
                </div>
                <button class="btn btn-danger" onclick="deleteMemo(${item.id})" style="padding:6px 10px; font-size:12px;">Delete</button>
              </div>
              <p style="white-space:pre-wrap; line-height:1.6; color:var(--text-secondary); margin-top:15px; font-size:15px;">${item.content}</p>
              ${fileAttachment}
            </div>
          `;
        }).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function openMemoModal() {
      document.querySelector('#broadcast-memo-modal form').reset();
      document.getElementById('memo-file-url').value = '';
      document.getElementById('upload-status').textContent = '';
      openModal('broadcast-memo-modal');
    }

    async function uploadMemoFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const statusSpan = document.getElementById('upload-status');
      statusSpan.textContent = 'Uploading...';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const token = localStorage.getItem('token');
        const res = await fetch(`${window.location.origin}/api/upload`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');

        document.getElementById('memo-file-url').value = data.fileUrl;
        statusSpan.textContent = 'Uploaded successfully!';
        statusSpan.style.color = 'var(--success)';
      } catch (err) {
        statusSpan.textContent = 'Upload failed.';
        statusSpan.style.color = 'var(--danger)';
        showToast(err.message, 'error');
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('memo-title').value,
        content: document.getElementById('memo-content').value,
        file_url: document.getElementById('memo-file-url').value
      };

      try {
        await apiFetch('/reports/memos-list', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        showToast('Memo circular published successfully!', 'success');
        closeModal('broadcast-memo-modal');
        loadMemos();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteMemo(id) {
      if (!confirm('Are you sure you want to delete this memo notice?')) return;
      try {
        await apiFetch(`/reports/memos-list/${id}`, { method: 'DELETE' });
        showToast('Memo deleted from board', 'success');
        loadMemos();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
