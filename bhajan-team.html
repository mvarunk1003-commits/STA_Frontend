<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhajan Team - OrgManager</title>
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SSTPA Portal">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .bhajan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .bhajan-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .bhajan-scale {
      align-self: flex-start;
      background: rgba(168, 85, 247, 0.1);
      color: var(--secondary-color);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-placeholder" class="sidebar glass-panel"></div>
    
    <main class="main-content">
      <header id="header-placeholder" class="main-header"></header>

      <section style="display:flex; justify-content:space-between; align-items:center; gap: 20px;" class="fade-in">
        <div style="flex:1; max-width: 400px;">
          <input type="text" id="bhajan-search" class="form-input" placeholder="🔍 Search by title or scale (e.g., C Major)..." oninput="filterBhajans()">
        </div>
        <button class="btn btn-primary" onclick="openModal('add-bhajan-modal')">+ Add Song</button>
      </section>

      <!-- Songs list -->
      <section id="bhajan-list" class="bhajan-grid fade-in">
        <div style="grid-column:1/-1; text-align:center; padding: 40px 0; color:var(--text-secondary);">
          Loading songs...
        </div>
      </section>
    </main>
  </div>

  <!-- Lyrics Modal -->
  <div id="lyrics-modal" class="modal-overlay">
    <div class="glass-panel modal-content" style="max-width:500px;">
      <div class="modal-header">
        <h2 id="lyrics-title" style="font-weight:700;">Song Lyrics</h2>
        <button onclick="closeModal('lyrics-modal')" style="background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" style="text-align:center; white-space:pre-wrap; line-height:1.6; font-size:16px;" id="lyrics-content">
        <!-- Lyrics go here -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('lyrics-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Add Song Modal -->
  <div id="add-bhajan-modal" class="modal-overlay">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <h2 style="font-weight: 700; font-size:20px;">Add Song to Catalog</h2>
        <button onclick="closeModal('add-bhajan-modal')" style="background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer;">&times;</button>
      </div>
      <form onsubmit="handleAddBhajan(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="b-title">Song Title</label>
            <input type="text" id="b-title" class="form-input" placeholder="e.g., He Govinda He Gopala" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="b-scale">Musical Scale / Key</label>
            <input type="text" id="b-scale" class="form-input" placeholder="e.g., C Major or A Minor">
          </div>
          <div class="form-group">
            <label class="form-label" for="b-audio">Practice Audio Link / File URL (Optional)</label>
            <input type="text" id="b-audio" class="form-input" placeholder="e.g., https://example.com/audio.mp3">
          </div>
          <div class="form-group">
            <label class="form-label" for="b-lyrics">Lyrics / Notation</label>
            <textarea id="b-lyrics" class="form-textarea" rows="8" placeholder="Type or paste lyrics here..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('add-bhajan-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Song</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    let allSongs = [];

    document.addEventListener('DOMContentLoaded', loadBhajans);

    async function loadBhajans() {
      try {
        allSongs = await apiFetch('/reports/bhajans');
        renderBhajans(allSongs);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderBhajans(songs) {
      const container = document.getElementById('bhajan-list');
      if (!songs || songs.length === 0) {
        container.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding: 40px 0; color:var(--text-secondary);" class="glass-panel">
            No bhajan songs found. Add songs to get started.
          </div>
        `;
        return;
      }

      container.innerHTML = songs.map(song => {
        const scale = song.scale || 'Scale Unspecified';
        const audioControl = song.audio_url 
          ? `<audio controls src="${song.audio_url}" style="width: 100%; margin-top: 10px; height: 32px; background:transparent;"></audio>`
          : '<div style="font-size:12px; color:var(--text-muted); margin-top:10px;">No practice audio available</div>';
        
        return `
          <div class="glass-panel glass-card bhajan-card fade-in">
            <span class="bhajan-scale">${scale}</span>
            <h3 style="font-size: 18px; font-weight:700; margin-bottom: 12px;">${song.title}</h3>
            
            <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
              ${audioControl}
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid var(--panel-border); padding-top:10px;">
                <button class="btn btn-secondary" onclick="viewLyrics(${song.id})" style="padding:6px 12px; font-size:12px;">View Lyrics</button>
                <button class="btn btn-danger" onclick="deleteBhajan(${song.id})" style="padding:6px 10px; font-size:12px;">Delete</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterBhajans() {
      const query = document.getElementById('bhajan-search').value.toLowerCase().trim();
      const filtered = allSongs.filter(s => {
        return s.title.toLowerCase().includes(query) || (s.scale && s.scale.toLowerCase().includes(query));
      });
      renderBhajans(filtered);
    }

    function viewLyrics(id) {
      const song = allSongs.find(s => s.id === id);
      if (!song) return;

      document.getElementById('lyrics-title').textContent = song.title;
      document.getElementById('lyrics-content').textContent = song.lyrics || 'No lyrics available for this song.';
      openModal('lyrics-modal');
    }

    async function handleAddBhajan(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('b-title').value,
        scale: document.getElementById('b-scale').value,
        lyrics: document.getElementById('b-lyrics').value,
        audio_url: document.getElementById('b-audio').value
      };

      try {
        await apiFetch('/reports/bhajans', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        showToast('Bhajan song added to directory!', 'success');
        closeModal('add-bhajan-modal');
        e.target.reset();
        loadBhajans();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteBhajan(id) {
      if (!confirm('Are you sure you want to delete this song?')) return;
      try {
        await apiFetch(`/reports/bhajans/${id}`, { method: 'DELETE' });
        showToast('Song removed', 'success');
        loadBhajans();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
