<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - SSTPA Portal</title>
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SSTPA Portal">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .notif-list { display: flex; flex-direction: column; gap: 12px; }
    .notif-card {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      transition: all 0.2s ease;
      cursor: default;
    }
    .notif-card.unread {
      border-left: 3px solid var(--primary-color);
      background: rgba(234, 88, 12, 0.04);
    }
    .notif-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .notif-icon.approval_request { background: rgba(245,158,11,0.15); }
    .notif-icon.approval_result  { background: rgba(34,197,94,0.12); }
    .notif-icon.warning          { background: rgba(239,68,68,0.12); }
    .notif-icon.info             { background: rgba(59,130,246,0.12); }
    .notif-body { flex: 1; }
    .notif-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .notif-message { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .notif-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .notif-recipient-tag {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 10px; font-weight: 700; margin-left: 8px;
      background: rgba(59,130,246,0.12); color: var(--accent-color);
      border: 1px solid rgba(59,130,246,0.25);
    }
    .compose-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; margin-bottom: 28px; }

    /* Send mode toggle */
    .send-mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .send-mode-tab {
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
      border: 1px solid var(--panel-border); background: transparent; color: var(--text-secondary);
      transition: all 0.15s ease;
    }
    .send-mode-tab.active {
      background: var(--primary-color); color: white; border-color: var(--primary-color);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-placeholder" class="sidebar glass-panel"></div>
    
    <main class="main-content">
      <header id="header-placeholder" class="main-header"></header>

      <section style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;" class="fade-in">
        <div>
          <h2 style="font-size:22px; font-weight:700;">Notification Center</h2>
          <p id="notif-subtitle" style="font-size:13px; color:var(--text-secondary); margin-top:4px;"></p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btn btn-secondary" onclick="markAllRead()" style="font-size:13px; padding:8px 14px;">✓ Mark All Read</button>
          <button id="compose-toggle-btn" class="btn btn-primary tier1-only" onclick="toggleCompose()" style="display:none;">+ Send Notification</button>
        </div>
      </section>

      <!-- Tier 1: Compose Notification Panel -->
      <section id="compose-section" class="compose-panel fade-in tier1-only" style="display:none;">
        <h3 style="font-size:16px; font-weight:700; margin-bottom:16px;">Compose &amp; Send Notification</h3>
        <form onsubmit="sendNotification(event)">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:12px;">
            <div class="form-group">
              <label class="form-label" for="notif-title-input">Notification Title</label>
              <input type="text" id="notif-title-input" class="form-input" placeholder="e.g., Upcoming Event Reminder" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="notif-type">Type</label>
              <select id="notif-type" class="form-select">
                <option value="info">ℹ️ Info</option>
                <option value="warning">⚠️ Warning</option>
                <option value="approval_result">✓ Approval Result</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="notif-message">Message</label>
            <textarea id="notif-message" class="form-textarea" rows="3" placeholder="Enter the notification message..." required></textarea>
          </div>

          <!-- Send Mode Toggle -->
          <div class="form-group">
            <label class="form-label">Send To</label>
            <div class="send-mode-tabs">
              <button type="button" class="send-mode-tab active" id="tab-specific" onclick="setSendMode('specific')">👤 Specific User</button>
              <button type="button" class="send-mode-tab" id="tab-broadcast" onclick="setSendMode('broadcast')">📢 Broadcast by Role</button>
            </div>

            <!-- Specific User Mode -->
            <div id="send-specific-panel">
              <select id="notif-target-user" class="form-select">
                <option value="">-- Select a user --</option>
              </select>
              <p style="font-size:11px; color:var(--text-muted); margin-top:6px;">The notification will be visible <strong>only to the selected user</strong> and the Admin.</p>
            </div>

            <!-- Broadcast Mode -->
            <div id="send-broadcast-panel" style="display:none;">
              <select id="notif-target-role" class="form-select">
                <option value="all">Everyone</option>
                <option value="state_coordinator">State Coordinators</option>
                <option value="district_coordinator,taluk_coordinator">District &amp; Taluk Coordinators (Tier 2)</option>
                <option value="district_coordinator">District Coordinators Only</option>
                <option value="taluk_coordinator">Taluk Coordinators Only</option>
              </select>
              <p style="font-size:11px; color:var(--text-muted); margin-top:6px;">Broadcast notifications are visible to <strong>all matching users</strong> and the Admin.</p>
            </div>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
            <button type="button" class="btn btn-secondary" onclick="toggleCompose()">Cancel</button>
            <button type="submit" class="btn btn-primary">📤 Send Notification</button>
          </div>
        </form>
      </section>

      <!-- Notifications List -->
      <section class="fade-in">
        <div id="notif-list" class="notif-list">
          <div style="text-align:center; padding:40px; color:var(--text-secondary);">Loading notifications...</div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="js/app.js"></script>
  <script>
    const typeIcons = {
      approval_request: '🔔',
      approval_result: '✅',
      warning: '⚠️',
      info: 'ℹ️'
    };

    let sendMode = 'specific'; // 'specific' | 'broadcast'

    document.addEventListener('DOMContentLoaded', () => {
      if (isTier1()) {
        document.getElementById('compose-toggle-btn').style.display = '';
        document.getElementById('notif-subtitle').textContent = isAdmin()
          ? 'You see all notifications in the system. Send to specific users or broadcast by role.'
          : 'Manage and send notifications to coordinators.';
        loadUserList();
      } else {
        document.getElementById('notif-subtitle').textContent = 'Your personal notifications from administrators.';
      }
      loadNotifications();
    });

    function setSendMode(mode) {
      sendMode = mode;
      document.getElementById('tab-specific').classList.toggle('active', mode === 'specific');
      document.getElementById('tab-broadcast').classList.toggle('active', mode === 'broadcast');
      document.getElementById('send-specific-panel').style.display  = mode === 'specific'  ? '' : 'none';
      document.getElementById('send-broadcast-panel').style.display = mode === 'broadcast' ? '' : 'none';
    }

    async function loadUserList() {
      try {
        const users = await apiFetch('/notifications/users');
        const select = document.getElementById('notif-target-user');
        if (!users || users.length === 0) return;
        const roleLabels = {
          admin: 'Admin',
          state_coordinator: 'State Coord.',
          district_coordinator: 'District Coord.',
          taluk_coordinator: 'Taluk Coord.'
        };
        select.innerHTML = '<option value="">-- Select a user --</option>' +
          users.map(u => `<option value="${u.id}">[${roleLabels[u.role] || u.role}] ${u.username}</option>`).join('');
      } catch (err) { /* silent */ }
    }

    async function loadNotifications() {
      try {
        const list = await apiFetch('/notifications');
        const container = document.getElementById('notif-list');
        if (!list || list.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding:60px; color:var(--text-secondary);" class="glass-panel">
              <p style="font-size:36px; margin-bottom:12px;">🔔</p>
              <p style="font-size:16px; font-weight:500;">No notifications yet.</p>
              <p style="font-size:13px; margin-top:6px;">You'll receive alerts for approvals, updates, and announcements here.</p>
            </div>`;
          return;
        }

        container.innerHTML = list.map(n => {
          const icon = typeIcons[n.type] || 'ℹ️';
          const dateStr = new Date(n.created_at).toLocaleString();
          const unreadClass = n.is_read ? '' : 'unread';
          const senderInfo = n.sender_name ? `From: <strong>${n.sender_name}</strong> · ` : '';

          // Show recipient tag on admin view
          let recipientTag = '';
          if (isAdmin()) {
            if (n.target_username) {
              recipientTag = `<span class="notif-recipient-tag">→ ${n.target_username}</span>`;
            } else if (n.target_roles) {
              recipientTag = `<span class="notif-recipient-tag">→ ${n.target_roles}</span>`;
            }
          }

          const deleteBtn = isTier1()
            ? `<button onclick="deleteNotif(${n.id})" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px; line-height:1; padding:0;" title="Delete">&times;</button>`
            : '';
          return `
            <div class="notif-card ${unreadClass}" id="notif-${n.id}" onclick="markRead(${n.id})">
              <div class="notif-icon ${n.type || 'info'}">${icon}</div>
              <div class="notif-body">
                <div class="notif-title">${n.title}${recipientTag}${n.is_read ? '' : ' <span style="display:inline-block;width:8px;height:8px;background:var(--primary-color);border-radius:50%;vertical-align:middle;margin-left:6px;"></span>'}</div>
                <div class="notif-message">${n.message}</div>
                <div class="notif-meta">${senderInfo}${dateStr}</div>
              </div>
              ${deleteBtn}
            </div>`;
        }).join('');
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function markRead(id) {
      const card = document.getElementById(`notif-${id}`);
      if (card && card.classList.contains('unread')) {
        try {
          await apiFetch(`/notifications/${id}/read`, { method: 'POST' });
          card.classList.remove('unread');
          const dot = card.querySelector('.notif-title span');
          if (dot) dot.remove();
        } catch (err) { /* silent */ }
      }
    }

    async function markAllRead() {
      try {
        await apiFetch('/notifications/mark-all-read', { method: 'POST' });
        showToast('All notifications marked as read', 'success');
        loadNotifications();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function sendNotification(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('notif-title-input').value,
        message: document.getElementById('notif-message').value,
        type: document.getElementById('notif-type').value,
      };

      if (sendMode === 'specific') {
        const userId = document.getElementById('notif-target-user').value;
        if (!userId) { showToast('Please select a user to send to.', 'error'); return; }
        payload.target_user_id = userId;
      } else {
        payload.target_roles = document.getElementById('notif-target-role').value;
      }

      try {
        await apiFetch('/notifications', { method: 'POST', body: JSON.stringify(payload) });
        showToast('Notification sent successfully!', 'success');
        e.target.reset();
        setSendMode('specific');
        toggleCompose();
        loadNotifications();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteNotif(id) {
      if (!confirm('Delete this notification?')) return;
      try {
        await apiFetch(`/notifications/${id}`, { method: 'DELETE' });
        document.getElementById(`notif-${id}`)?.remove();
        showToast('Notification deleted', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function toggleCompose() {
      const section = document.getElementById('compose-section');
      const btn = document.getElementById('compose-toggle-btn');
      const isHidden = section.style.display === 'none';
      section.style.display = isHidden ? '' : 'none';
      btn.textContent = isHidden ? '✕ Cancel' : '+ Send Notification';
    }
  </script>
</body>
</html>
