<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget & Expenses - SSTPA Portal</title>
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SSTPA Portal">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-placeholder" class="sidebar glass-panel"></div>
    
    <main class="main-content">
      <header id="header-placeholder" class="main-header"></header>

      <section style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;" class="fade-in">
        <div>
          <h2 style="font-size: 22px; font-weight:700;">Budget & Expenses</h2>
          <p id="expenses-subtitle" style="font-size:13px; color:var(--text-secondary); margin-top:4px;"></p>
        </div>
        <button class="btn btn-primary" onclick="openExpenseModal()">+ Submit Budget Request</button>
      </section>

      <!-- Tier 1: Pending Approvals -->
      <section id="pending-expenses-section" style="display:none;" class="fade-in">
        <h3 style="font-size:16px; font-weight:700; color:#f59e0b; margin-bottom:16px;">⏳ Pending Budget Requests</h3>
        <div class="glass-panel glass-card" style="overflow:hidden; padding:0;">
          <div class="table-container">
            <table class="glass-table">
              <thead><tr><th>Title</th><th>Category</th><th>Amount</th><th>Submitted By</th><th>Date</th><th style="text-align:right;">Actions</th></tr></thead>
              <tbody id="pending-expenses-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- All Expenses Table -->
      <section class="glass-panel glass-card fade-in" style="overflow: hidden;">
        <div class="table-container">
          <table class="glass-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Linked Event</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Receipt</th>
                <th style="text-align:right;">Action</th>
              </tr>
            </thead>
            <tbody id="expenses-tbody">
              <tr>
                <td colspan="8" style="text-align:center; color:var(--text-muted);">Loading expenditures log...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Record Expense Modal -->
  <div id="global-expense-modal" class="modal-overlay">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <h2 style="font-weight: 700; font-size:20px;">Record Expense</h2>
        <button onclick="closeModal('global-expense-modal')" style="background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer;">&times;</button>
      </div>
      <form onsubmit="handleFormSubmit(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="exp-title">Expense Title</label>
            <input type="text" id="exp-title" class="form-input" placeholder="e.g., Sound System Hire" required>
          </div>
          <div id="expense-tier2-notice" style="display:none; padding:10px 14px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:8px; font-size:13px; color:#f59e0b; margin-bottom:12px;">
            ⚠️ Budget requests require approval by Admin/State Coordinator before being recorded.
          </div>
          <div class="form-group" style="display:none;"><!-- placeholder to fix structure -->
          </div>
          <div class="form-group">
            <label class="form-label" for="exp-amount">Amount ($)</label>
            <input type="number" id="exp-amount" class="form-input" placeholder="e.g., 250" min="0" step="any" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="exp-event">Linked Event (Optional)</label>
            <select id="exp-event" class="form-select">
              <option value="">General Organizational Expense</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="exp-category">Category</label>
            <select id="exp-category" class="form-select">
              <option value="catering">Catering & Food</option>
              <option value="venue">Venue Booking</option>
              <option value="sound">Sound & AV equipment</option>
              <option value="decor">Decorations</option>
              <option value="travel">Travel & Logistics</option>
              <option value="misc">Miscellaneous</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="exp-date">Date</label>
            <input type="date" id="exp-date" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="exp-receipt">Upload Receipt (Optional)</label>
            <input type="file" id="exp-receipt" class="form-input" onchange="uploadReceipt(event)">
            <input type="hidden" id="exp-receipt-url">
            <span id="upload-status" style="font-size:12px; color:var(--text-muted); display:block; margin-top:4px;"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('global-expense-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (isTier2()) {
        document.getElementById('expenses-subtitle').textContent = 'Budget requests require approval. Approved expenses appear in reports.';
        document.getElementById('expense-tier2-notice').style.display = '';
      }
      if (isTier1()) {
        document.getElementById('pending-expenses-section').style.display = '';
        loadPendingExpenses();
      }
      loadExpenses();
      loadEventsDropdown();
    });

    async function loadPendingExpenses() {
      try {
        const all = await apiFetch('/reports/expenses-list');
        const pending = (all || []).filter(e => e.status === 'pending');
        const tbody = document.getElementById('pending-expenses-tbody');
        if (!pending.length) { document.getElementById('pending-expenses-section').style.display = 'none'; return; }
        tbody.innerHTML = pending.map(item => `
          <tr>
            <td style="font-weight:600;">${item.title}</td>
            <td style="text-transform:capitalize;">${item.category}</td>
            <td style="color:var(--danger); font-weight:600;">₹${Number(item.amount).toLocaleString()}</td>
            <td>${item.submitter_name || 'Unknown'}</td>
            <td>${new Date(item.date).toLocaleDateString()}</td>
            <td style="text-align:right;">
              <div style="display:flex; justify-content:flex-end; gap:6px;">
                <button class="btn btn-primary" onclick="approveExpense(${item.id})" style="padding:5px 10px; font-size:12px;">✓ Approve</button>
                <button class="btn btn-danger" onclick="rejectExpense(${item.id})" style="padding:5px 10px; font-size:12px;">✗ Reject</button>
              </div>
            </td>
          </tr>`).join('');
      } catch (err) { /* ignore */ }
    }

    async function loadExpenses() {
      try {
        const list = await apiFetch('/reports/expenses-list');
        const tbody = document.getElementById('expenses-tbody');

        if (!list || list.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align:center; color:var(--text-muted); padding:30px;">
                No expenses logged in system.
              </td>
            </tr>
          `;
          return;
        }

        const userId = getCurrentUser().id;
        tbody.innerHTML = list.map(item => {
          const eventTitle = item.event_title || '<span style="color:var(--text-muted);">General</span>';
          const dateStr = new Date(item.date).toLocaleDateString();
          const receipt = item.receipt_url
            ? `<a href="${window.location.origin}${item.receipt_url}" target="_blank" style="color:var(--primary-color); text-decoration:none;">📄 View</a>`
            : '<span style="color:var(--text-muted);">—</span>';
          const canDelete = isTier1() || item.submitted_by === userId;
          const deleteBtn = canDelete
            ? `<button class="btn btn-danger" onclick="deleteExpense(${item.id})" style="padding:5px 10px; font-size:12px;">Del</button>`
            : '<span style="color:var(--text-muted);">—</span>';

          return `
            <tr>
              <td style="font-weight:600;">${item.title}</td>
              <td style="text-transform:capitalize;">${item.category}</td>
              <td>${eventTitle}</td>
              <td>${dateStr}</td>
              <td style="font-weight:600; color:var(--danger);">₹${Number(item.amount).toLocaleString()}</td>
              <td>${getStatusBadge(item.status || 'approved')}</td>
              <td>${receipt}</td>
              <td style="text-align:right;">${deleteBtn}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function loadEventsDropdown() {
      try {
        const events = await apiFetch('/events');
        const select = document.getElementById('exp-event');
        if (!events) return;
        
        events.forEach(evt => {
          const opt = document.createElement('option');
          opt.value = evt.id;
          opt.textContent = `${evt.title} (${new Date(evt.date).toLocaleDateString()})`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error(err.message);
      }
    }

    function openExpenseModal() {
      document.querySelector('#global-expense-modal form').reset();
      document.getElementById('exp-receipt-url').value = '';
      document.getElementById('upload-status').textContent = '';
      
      // Default to today's date
      document.getElementById('exp-date').value = new Date().toISOString().split('T')[0];
      
      openModal('global-expense-modal');
    }

    async function uploadReceipt(e) {
      const file = e.target.files[0];
      if (!file) return;

      const statusSpan = document.getElementById('upload-status');
      statusSpan.textContent = 'Uploading...';
      
      const formData = new FormData();
      formData.append('file', file);

      try {
        const token = localStorage.getItem('token');
        const res = await fetch(`${window.location.origin}/api/upload`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');

        document.getElementById('exp-receipt-url').value = data.fileUrl;
        statusSpan.textContent = 'Uploaded successfully!';
        statusSpan.style.color = 'var(--success)';
      } catch (err) {
        statusSpan.textContent = 'Upload failed.';
        statusSpan.style.color = 'var(--danger)';
        showToast(err.message, 'error');
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('exp-title').value,
        amount: parseFloat(document.getElementById('exp-amount').value),
        event_id: document.getElementById('exp-event').value ? parseInt(document.getElementById('exp-event').value) : null,
        category: document.getElementById('exp-category').value,
        date: document.getElementById('exp-date').value,
        receipt_url: document.getElementById('exp-receipt-url').value
      };

      try {
        const result = await apiFetch('/reports/expenses-list', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        showToast(result?.status === 'pending' ? 'Budget request submitted for approval!' : 'Expense recorded!', 'success');
        closeModal('global-expense-modal');
        loadExpenses();
        if (isTier1()) loadPendingExpenses();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function approveExpense(id) {
      try {
        await apiFetch(`/reports/expenses-list/${id}/approve`, { method: 'POST' });
        showToast('Budget request approved!', 'success');
        loadPendingExpenses(); loadExpenses();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function rejectExpense(id) {
      const reason = prompt('Reason for rejection (optional):');
      if (reason === null) return;
      try {
        await apiFetch(`/reports/expenses-list/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
        showToast('Budget request rejected.', 'success');
        loadPendingExpenses(); loadExpenses();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteExpense(id) {
      if (!confirm('Are you sure you want to delete this expense record?')) return;
      try {
        await apiFetch(`/reports/expenses-list/${id}`, { method: 'DELETE' });
        showToast('Expense record deleted', 'success');
        loadExpenses();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
